<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Manrope Font Embeded -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <!-- Animate CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- JS -->
    <script src="./main.js" defer></script>

    <title>Smart Home | Thermostat Widget</title>
  </head>
  <body>
    <div class="main-container">
      <div class="container animate__animated animate__fadeInUp">
        <div class="top-content">
          <h1 class="logo">Thermostat</h1>
          <div class="group-flex">
            <select id="rooms"></select>
            <button class="btn btn-open">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus-icon lucide-plus"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            </button>
          </div>
        </div>
        <!-- Interior card -->
        <div class="room">
          <div class="text">
            <h3 class="room-name">Living Room</h3>
            <p class="currentTemp">27°</p>
          </div>
        </div>
        <div class="main-content">
          <div class="temperature">
            <svg
              class="point"
              width="44"
              height="44"
              viewBox="0 0 44 44"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle
                cx="22"
                cy="22"
                r="19.5"
                fill="#515155"
                stroke="white"
                stroke-width="5"
              />
              <circle cx="21.5" cy="21.5" r="9.5" fill="#FFD7A8" />
            </svg>

            <div class="info">
              <p>Current Temp</p>
              <h1 id="temp"></h1>
            </div>
          </div>

          <div class="controls">
            <p>Set Temperature</p>
            <div class="buttons">
              <button id="reduce">
                <ion-icon size="large" name="remove-outline"></ion-icon>
              </button>
              <button id="increase">
                <ion-icon size="large" name="add-outline"></ion-icon>
              </button>
            </div>
          </div>

          <div class="default-settings">
            <button id="cool">
              <ion-icon size="large" name="snow-outline"></ion-icon>
              Cool
            </button>
            <button id="warm">
              <ion-icon size="large" name="leaf"></ion-icon>
              warm
            </button>
          </div>
          
          <div class="configure">
            <button id="newPreset">
              <ion-icon name="cog"></ion-icon>Configure Presets
            </button>
          </div>

          <div class="inputs hidden">
            <input
              id="coolInput"
              type="number"
              min="10"
              max="22"
              placeholder="Cool"
            />
            <input
              id="warmInput"
              type="number"
              min="22"
              max="32"
              placeholder="Warm"
            />
            <button id="save">Save</button>
            <button id="close"><ion-icon name="close"></ion-icon></button>
            <span class="error"></span>
          </div>
        </div>
      </div>
      <div
        class="container  animate__animated animate__fadeIn"
      >
      <div class="rooms-control">

      </div>
        <!-- add button to turn all ac's on -->
        <div class="add">
          <button id="toggleAllAC">
            <ion-icon size="large" name="toggle-text"></ion-icon>
            <span class="add-text">Turn All AC's On</span>
          </button>
        </div>
      </div>

    <section class="modal hidden">
      <form class="modal-form">
        <div class="modal-header">
          <button class="btn-close">⨉</button>
        </div>
        <div>
          <h3>Add Room</h3>
        </div>

        <div class="group">
          <label for="room">Room name</label>
          <input type="room" id="room" placeholder="Room name" />
        </div>
        <div class="group">
          <label for="temp">Initial temperature</label>
          <input type="temp" id="temps" placeholder="Initial temperature" />
        </div>

        <div class="group-flex">
          <div class="group">
            <label for="start-time">Start time</label>
            <input type="time" id="start-time" value="00:00"/>
          </div>
          <div class="group">
            <label for="end-time">End time</label>
            <input type="time" id="end-time" value="23:59"/>
          </div>
        </div>
        <span class="info"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-info-icon lucide-info"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><small>Default time is 24 hours if not set</small></span>
        <span class="errors modal-error hidden"><small>Please fill all fields</small></span>
        <button class="btn" style="margin-top: 10px;">Save</button>
      </form>
    </section>
    <div class="overlay hidden"></div>
    
    <!-- Ionicons -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
